<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 知识文档管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 24px; color: #1a1a1a; font-size: 28px; }

        /* 搜索栏 */
        .search-bar { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; flex-wrap: wrap;
            background: #fff; padding: 16px 20px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .search-bar label { font-size: 14px; color: #555; }
        .search-bar input, .search-bar select {
            padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; outline: none; transition: border-color .2s;
        }
        .search-bar input:focus, .search-bar select:focus { border-color: #1677ff; }

        /* 按钮 */
        .btn { padding: 8px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: opacity .2s; }
        .btn:hover { opacity: .85; }
        .btn-primary { background: #1677ff; color: #fff; }
        .btn-success { background: #52c41a; color: #fff; }
        .btn-danger  { background: #ff4d4f; color: #fff; }
        .btn-warning { background: #faad14; color: #fff; }
        .btn-default { background: #fff; color: #333; border: 1px solid #d9d9d9; }
        .btn-sm { padding: 4px 12px; font-size: 13px; }

        /* 工具栏 */
        .toolbar { display: flex; justify-content: space-between; margin-bottom: 12px; }

        /* 表格 */
        .table-wrapper { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 14px; white-space: nowrap; }
        th { background: #fafafa; font-weight: 600; color: #555; }
        tr:hover { background: #f5f7fa; }
        .status-tag {
            display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 500;
        }
        .status-INIT          { background: #e6f7ff; color: #1677ff; }
        .status-UPLOADED      { background: #f6ffed; color: #52c41a; }
        .status-CONVERTING    { background: #fff7e6; color: #faad14; }
        .status-CONVERTED     { background: #fff1b8; color: #d48806; }
        .status-CHUNKED       { background: #f9f0ff; color: #722ed1; }
        .status-VECTOR_STORED { background: #f0f5ff; color: #2f54eb; }
        .status-FAILED        { background: #fff1f0; color: #ff4d4f; }

        /* 分页 */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 20px; }
        .pagination button { min-width: 32px; height: 32px; border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .pagination button.active { background: #1677ff; color: #fff; border-color: #1677ff; }
        .pagination button:disabled { opacity: .5; cursor: not-allowed; }
        .pagination span { font-size: 14px; color: #666; }

        /* 模态框 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; }
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #fff; border-radius: 8px; width: 520px; max-width: 90vw; z-index: 1001;
            max-height: 90vh; display: none; flex-direction: column;
            box-shadow: 0 6px 16px rgba(0,0,0,.12);
        }
        .modal-header { padding: 16px 24px; border-bottom: 1px solid #f0f0f0; font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .modal-header .close { cursor: pointer; font-size: 20px; color: #999; background: none; border: none; }
        .modal-body { padding: 24px; overflow-y: auto; flex: 1 1 auto; }
        .modal-body .form-item { margin-bottom: 16px; }
        .modal-body .form-item label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }
        .modal-body .form-item input, .modal-body .form-item select, .modal-body .form-item textarea {
            width: 100%; padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; outline: none; transition: border-color .2s;
        }
        .modal-body .form-item textarea { resize: vertical; min-height: 70px; }
        .modal-body .form-item input:focus, .modal-body .form-item select:focus, .modal-body .form-item textarea:focus { border-color: #1677ff; }
        .modal-footer { padding: 12px 24px; border-top: 1px solid #f0f0f0; text-align: right; display: flex; gap: 8px; justify-content: flex-end; flex-shrink: 0; }

        /* 详情 */
        .detail-row { display: flex; padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
        .detail-label { width: 100px; color: #888; flex-shrink: 0; }
        .detail-value { flex: 1; word-break: break-all; }
    </style>
</head>
<body>
<div class="container">
    <h1>RAG 知识文档管理</h1>

    <!-- 搜索栏 -->
    <div class="search-bar">
        <label>标题：</label>
        <input id="searchTitle" type="text" placeholder="请输入文档标题">
        <label>状态：</label>
        <select id="searchStatus">
            <option value="">全部</option>
            <option value="INIT">INIT</option>
            <option value="UPLOADED">UPLOADED</option>
            <option value="CONVERTING">CONVERTING</option>
            <option value="CONVERTED">CONVERTED</option>
            <option value="CHUNKED">CHUNKED</option>
            <option value="VECTOR_STORED">VECTOR_STORED</option>
        </select>
        <button class="btn btn-primary" onclick="loadPage(1)">搜索</button>
        <button class="btn btn-default" onclick="resetSearch()">重置</button>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
        <div>
            <button class="btn btn-success" onclick="openAddModal()">+ 新增文档</button>
            <button class="btn btn-danger" onclick="batchDelete()">批量删除</button>
        </div>
        <div>
            <button class="btn btn-default btn-sm" onclick="loadPage(currentPage)">刷新</button>
        </div>
    </div>

    <!-- 表格 -->
    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th><input type="checkbox" id="checkAll" onclick="toggleCheckAll()"></th>
                <th>ID</th>
                <th>标题</th>
                <th>文件</th>
                <th>类型</th>
                <th>状态</th>
                <th>分片大小</th>
                <th>重叠</th>
                <th>权限</th>
                <th>失效日期</th>
                <th>描述</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- 分页 -->
    <div class="pagination" id="pagination"></div>
</div>

<!-- 新增/编辑模态框 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
<div class="modal" id="formModal">
    <div class="modal-header">
        <span id="modalTitle">新增文档</span>
        <button class="close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
        <input type="hidden" id="formId">
        <div class="form-item">
            <label>上传文件 <span style="color:red">*</span></label>
            <div style="border:2px dashed #d9d9d9;border-radius:8px;padding:30px;text-align:center;cursor:pointer;transition:border-color .2s;" id="dropZone" onclick="document.getElementById('formFile').click()" ondragover="event.preventDefault();this.style.borderColor='#1677ff'" ondragleave="this.style.borderColor='#d9d9d9'" ondrop="event.preventDefault();this.style.borderColor='#d9d9d9';handleFileDrop(event)">
                <div style="color:#999;margin-bottom:8px;">&#128196;</div>
                <div id="fileLabel" style="color:#666;">点击选择文件或拖拽文件到此处</div>
                <div id="fileName" style="color:#1677ff;margin-top:8px;font-weight:500;display:none;"></div>
            </div>
            <input type="file" id="formFile" style="display:none;" onchange="handleFileSelect(this)">
        </div>
        <div class="form-item">
            <label>标题 <span style="color:red">*</span></label>
            <input type="text" id="formTitle" placeholder="请输入文档标题（留空则使用文件名）">
        </div>
        <div class="form-item">
            <label>失效日期</label>
            <input type="date" id="formExpireDate">
        </div>
        <div class="form-item">
            <label>描述</label>
            <textarea id="formDescription" placeholder="请输入文档描述"></textarea>
        </div>
        <div class="form-item">
            <label>文档权限</label>
            <select id="formAccessibleBy">
                <option value="STAFF">仅客服可见</option>
                <option value="CUSTOMER">外部客户及以上可见</option>
                <option value="VISITOR">所有人可见</option>
            </select>
        </div>
        <div class="form-item">
            <label>分片大小 (chunkSize)</label>
            <input type="number" id="formChunkSize" placeholder="每个分块的最大字符数，默认500" min="1">
        </div>
        <div class="form-item">
            <label>重叠字符数 (overlap)</label>
            <input type="number" id="formOverlap" placeholder="相邻分块重叠字符数，默认50" min="0">
        </div>
        <div class="form-item">
            <label>扩展字段 (JSON)</label>
            <textarea id="formExtension" placeholder='请输入JSON字符串，如 {"key":"value"}'></textarea>
        </div>
        <!-- 上传进度 -->
        <div id="uploadProgress" style="display:none;margin-top:12px;">
            <div style="background:#f0f0f0;border-radius:4px;height:8px;overflow:hidden;">
                <div id="progressBar" style="background:#1677ff;height:100%;width:0%;transition:width .3s;"></div>
            </div>
            <div id="progressText" style="text-align:center;font-size:12px;color:#666;margin-top:4px;">上传中...</div>
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-default" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveDocument()">保存</button>
    </div>
</div>

<!-- 详情模态框 -->
<div class="modal" id="detailModal" style="width:560px;">
    <div class="modal-header">
        <span>文档详情</span>
        <button class="close" onclick="closeDetailModal()">&times;</button>
    </div>
    <div class="modal-body" id="detailContent"></div>
    <div class="modal-footer">
        <button class="btn btn-default" onclick="closeDetailModal()">关闭</button>
    </div>
</div>

<script>
    const BASE_URL = '/api/documents';
    let currentPage = 1;
    let pageSize = 10;
    let totalPages = 0;

    // ========== 分页查询 ==========
    async function loadPage(page) {
        currentPage = page;
        const title = document.getElementById('searchTitle').value.trim();
        const status = document.getElementById('searchStatus').value;
        const params = new URLSearchParams({ pageNum: page, pageSize });
        if (title) params.append('title', title);
        if (status) params.append('status', status);

        try {
            const res = await fetch(`${BASE_URL}/page?${params}`);
            const data = await res.json();
            totalPages = data.pages || 0;
            renderTable(data.records || []);
            renderPagination(data);
        } catch (e) {
            alert('加载数据失败：' + e.message);
        }
    }

    function renderTable(records) {
        const tbody = document.getElementById('tableBody');
        if (!records.length) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#999;">暂无数据</td></tr>';
            return;
        }
        tbody.innerHTML = records.map(r => `
            <tr>
                <td><input type="checkbox" class="row-check" value="${r.id}"></td>
                <td>${r.id}</td>
                <td><a href="javascript:void(0)" onclick="viewDetail(${r.id})" style="color:#1677ff;">${escapeHtml(r.title || '')}</a></td>
                <td>${r.fileUrl ? '<a href="' + escapeHtml(r.fileUrl) + '" target="_blank" style="color:#1677ff;">查看文件</a>' : '-'}</td>
                <td>${r.fileType || '-'}</td>
                <td><span class="status-tag status-${r.status}">${r.status || ''}</span></td>
                <td>${r.chunkSize || '-'}</td>
                <td>${r.overlap || '-'}</td>
                <td>${formatAccessibleBy(r.accessibleBy)}</td>
                <td>${r.expireDate || '-'}</td>
                <td title="${escapeHtml(r.description || '')}">${truncate(r.description, 20)}</td>
                <td>${formatDateTime(r.createdTime)}</td>
                <td>
                    <button class="btn btn-primary btn-sm" onclick="openEditModal(${r.id})">编辑</button>
                    <button class="btn btn-success btn-sm" onclick="goSegments(${r.id})">分段</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteDocument(${r.id})">删除</button>
                </td>
            </tr>
        `).join('');
    }

    function renderPagination(data) {
        const div = document.getElementById('pagination');
        if (data.pages <= 0) { div.innerHTML = ''; return; }
        let html = `<button ${data.current <= 1 ? 'disabled' : ''} onclick="loadPage(${data.current - 1})">上一页</button>`;
        for (let i = 1; i <= data.pages; i++) {
            if (data.pages > 7 && Math.abs(i - data.current) > 2 && i !== 1 && i !== data.pages) {
                if (i === 2 || i === data.pages - 1) html += '<span>...</span>';
                continue;
            }
            html += `<button class="${i === data.current ? 'active' : ''}" onclick="loadPage(${i})">${i}</button>`;
        }
        html += `<button ${data.current >= data.pages ? 'disabled' : ''} onclick="loadPage(${data.current + 1})">下一页</button>`;
        html += `<span>共 ${data.total} 条</span>`;
        div.innerHTML = html;
    }

    // ========== 搜索/重置 ==========
    function resetSearch() {
        document.getElementById('searchTitle').value = '';
        document.getElementById('searchStatus').value = '';
        loadPage(1);
    }

    // ========== 全选 ==========
    function toggleCheckAll() {
        const checked = document.getElementById('checkAll').checked;
        document.querySelectorAll('.row-check').forEach(cb => cb.checked = checked);
    }

    // ========== 新增 ==========
    function openAddModal() {
        document.getElementById('modalTitle').textContent = '上传文档';
        document.getElementById('formId').value = '';
        document.getElementById('formTitle').value = '';
        document.getElementById('formExpireDate').value = '';
        document.getElementById('formDescription').value = '';
        document.getElementById('formExtension').value = '';
        document.getElementById('formChunkSize').value = '';
        document.getElementById('formOverlap').value = '';
        document.getElementById('formAccessibleBy').value = 'STAFF';
        document.getElementById('formFile').value = '';
        document.getElementById('fileName').style.display = 'none';
        document.getElementById('fileLabel').style.display = 'block';
        document.getElementById('dropZone').style.display = 'block';
        document.getElementById('uploadProgress').style.display = 'none';
        showModal('formModal');
    }

    // ========== 编辑 ==========
    async function openEditModal(id) {
        try {
            const res = await fetch(`${BASE_URL}/${id}`);
            const doc = await res.json();
            if (!doc.id) { alert('文档不存在'); return; }
            document.getElementById('modalTitle').textContent = '编辑文档';
            document.getElementById('formId').value = doc.id;
            document.getElementById('formTitle').value = doc.title || '';
            document.getElementById('formExpireDate').value = doc.expireDate || '';
            document.getElementById('formDescription').value = doc.description || '';
            document.getElementById('formExtension').value = doc.extension || '';
            document.getElementById('formChunkSize').value = doc.chunkSize || '';
            document.getElementById('formOverlap').value = doc.overlap || '';
            // 编辑模式隐藏文件上传区域
            document.getElementById('formFile').value = '';
            document.getElementById('fileName').style.display = 'none';
            document.getElementById('fileLabel').style.display = 'none';
            document.getElementById('dropZone').style.display = 'none';
            document.getElementById('uploadProgress').style.display = 'none';
            showModal('formModal');
        } catch (e) {
            alert('获取文档失败：' + e.message);
        }
    }

    // ========== 文件选择 ==========
    function handleFileSelect(input) {
        if (input.files.length > 0) {
            const file = input.files[0];
            document.getElementById('fileName').textContent = file.name + ' (' + formatFileSize(file.size) + ')';
            document.getElementById('fileName').style.display = 'block';
            document.getElementById('fileLabel').style.display = 'none';
            // 自动填充标题
            if (!document.getElementById('formTitle').value) {
                const name = file.name;
                document.getElementById('formTitle').value = name.substring(0, name.lastIndexOf('.')) || name;
            }
        }
    }

    function handleFileDrop(event) {
        const files = event.dataTransfer.files;
        if (files.length > 0) {
            document.getElementById('formFile').files = files;
            handleFileSelect(document.getElementById('formFile'));
        }
    }

    function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    // ========== 保存（上传文件/编辑） ==========
    async function saveDocument() {
        const id = document.getElementById('formId').value;
        const title = document.getElementById('formTitle').value.trim();
        if (!title) { alert('请输入文档标题'); return; }

        // 编辑模式：使用 PUT 更新元数据
        if (id) {
            const body = {
                id: Number(id),
                title,
                expireDate: document.getElementById('formExpireDate').value || null,
                description: document.getElementById('formDescription').value.trim(),
                extension: document.getElementById('formExtension').value.trim(),
                chunkSize: document.getElementById('formChunkSize').value ? Number(document.getElementById('formChunkSize').value) : null,
                overlap: document.getElementById('formOverlap').value ? Number(document.getElementById('formOverlap').value) : null
            };
            try {
                const res = await fetch(BASE_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                if (res.ok) {
                    closeModal();
                    loadPage(currentPage);
                } else {
                    alert('保存失败');
                }
            } catch (e) {
                alert('保存异常：' + e.message);
            }
            return;
        }

        // 新增模式：上传文件
        const fileInput = document.getElementById('formFile');
        if (!fileInput.files.length) { alert('请选择要上传的文件'); return; }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('title', title);
        const expireDate = document.getElementById('formExpireDate').value;
        if (expireDate) formData.append('expireDate', expireDate);
        const description = document.getElementById('formDescription').value.trim();
        if (description) formData.append('description', description);
        const extension = document.getElementById('formExtension').value.trim();
        if (extension) formData.append('extension', extension);
        const chunkSize = document.getElementById('formChunkSize').value;
        if (chunkSize) formData.append('chunkSize', chunkSize);
        const overlap = document.getElementById('formOverlap').value;
        if (overlap) formData.append('overlap', overlap);
        const accessibleBy = document.getElementById('formAccessibleBy').value;
        formData.append('accessibleBy', accessibleBy);

        // 显示上传进度
        document.getElementById('uploadProgress').style.display = 'block';
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressText').textContent = '上传中...';

        try {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', `${BASE_URL}/upload`);

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    document.getElementById('progressBar').style.width = percent + '%';
                    document.getElementById('progressText').textContent = `上传中... ${percent}%`;
                }
            };

            xhr.onload = function() {
                document.getElementById('uploadProgress').style.display = 'none';
                if (xhr.status >= 200 && xhr.status < 300) {
                    closeModal();
                    loadPage(1);
                } else {
                    alert('上传失败: ' + xhr.statusText);
                }
            };

            xhr.onerror = function() {
                document.getElementById('uploadProgress').style.display = 'none';
                alert('上传异常，请检查网络');
            };

            xhr.send(formData);
        } catch (e) {
            document.getElementById('uploadProgress').style.display = 'none';
            alert('上传异常：' + e.message);
        }
    }

    // ========== 删除 ==========
    async function deleteDocument(id) {
        if (!confirm('确定要删除该文档吗？')) return;
        try {
            const res = await fetch(`${BASE_URL}/${id}`, { method: 'DELETE' });
            if (res.ok) loadPage(currentPage);
            else alert('删除失败');
        } catch (e) {
            alert('删除异常：' + e.message);
        }
    }

    // ========== 批量删除 ==========
    async function batchDelete() {
        const ids = [...document.querySelectorAll('.row-check:checked')].map(cb => Number(cb.value));
        if (!ids.length) { alert('请先选择要删除的文档'); return; }
        if (!confirm(`确定要删除选中的 ${ids.length} 个文档吗？`)) return;
        try {
            const res = await fetch(`${BASE_URL}/batch`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(ids)
            });
            if (res.ok) loadPage(currentPage);
            else alert('批量删除失败');
        } catch (e) {
            alert('删除异常：' + e.message);
        }
    }

    // ========== 查看详情 ==========
    async function viewDetail(id) {
        try {
            const res = await fetch(`${BASE_URL}/${id}`);
            const doc = await res.json();
            if (!doc.id) { alert('文档不存在'); return; }
            document.getElementById('detailContent').innerHTML = `
                <div class="detail-row"><div class="detail-label">ID</div><div class="detail-value">${doc.id}</div></div>
                <div class="detail-row"><div class="detail-label">标题</div><div class="detail-value">${escapeHtml(doc.title || '')}</div></div>
                <div class="detail-row"><div class="detail-label">文件地址</div><div class="detail-value">${doc.fileUrl ? '<a href="' + escapeHtml(doc.fileUrl) + '" target="_blank" style="color:#1677ff;">' + escapeHtml(doc.fileUrl) + '</a>' : '-'}</div></div>
                <div class="detail-row"><div class="detail-label">状态</div><div class="detail-value"><span class="status-tag status-${doc.status}">${doc.status || ''}</span></div></div>
                <div class="detail-row"><div class="detail-label">失效日期</div><div class="detail-value">${doc.expireDate || '-'}</div></div>
                <div class="detail-row"><div class="detail-label">描述</div><div class="detail-value">${escapeHtml(doc.description || '-')}</div></div>
                <div class="detail-row"><div class="detail-label">文件类型</div><div class="detail-value">${doc.fileType || '-'}</div></div>
                <div class="detail-row"><div class="detail-label">解析结果</div><div class="detail-value">${doc.parseResultUrl ? '<a href="' + escapeHtml(doc.parseResultUrl) + '" target="_blank" style="color:#1677ff;">下载解析结果</a>' : '-'}</div></div>
                <div class="detail-row"><div class="detail-label">MinerU任务</div><div class="detail-value">${doc.mineruTaskId || '-'}</div></div>
                <div class="detail-row"><div class="detail-label">分片大小</div><div class="detail-value">${doc.chunkSize || '-'}</div></div>
                <div class="detail-row"><div class="detail-label">重叠字符数</div><div class="detail-value">${doc.overlap || '-'}</div></div>
                <div class="detail-row"><div class="detail-label">扩展字段</div><div class="detail-value">${escapeHtml(doc.extension || '-')}</div></div>
                <div class="detail-row"><div class="detail-label">创建时间</div><div class="detail-value">${formatDateTime(doc.createdTime)}</div></div>
                <div class="detail-row"><div class="detail-label">修改时间</div><div class="detail-value">${formatDateTime(doc.updatedTime)}</div></div>
            `;
            showModal('detailModal');
        } catch (e) {
            alert('获取详情失败：' + e.message);
        }
    }

    // ========== 模态框控制 ==========
    function showModal(id) {
        document.getElementById('modalOverlay').style.display = 'block';
        document.getElementById(id).style.display = 'flex';
    }
    function closeModal() {
        document.getElementById('modalOverlay').style.display = 'none';
        document.getElementById('formModal').style.display = 'none';
    }
    function closeDetailModal() {
        document.getElementById('modalOverlay').style.display = 'none';
        document.getElementById('detailModal').style.display = 'none';
    }

    // ========== 工具函数 ==========
    function formatAccessibleBy(val) {
        if (!val || val === 'STAFF') return '<span style="color:#ff4d4f;">仅客服</span>';
        if (val === 'CUSTOMER') return '<span style="color:#faad14;">客户及以上</span>';
        if (val === 'VISITOR') return '<span style="color:#52c41a;">所有人</span>';
        return val;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
    function truncate(str, len) {
        if (!str) return '-';
        return str.length > len ? escapeHtml(str.substring(0, len)) + '...' : escapeHtml(str);
    }
    function formatDateTime(dt) {
        if (!dt) return '-';
        if (Array.isArray(dt)) {
            const [y, m, d, h, mi, s] = dt;
            return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')} ${String(h||0).padStart(2,'0')}:${String(mi||0).padStart(2,'0')}:${String(Math.floor(s||0)).padStart(2,'0')}`;
        }
        return String(dt).replace('T', ' ').substring(0, 19);
    }

    // ========== 跳转分段管理 ==========
    function goSegments(docId) {
        window.location.href = 'segment.html?documentId=' + docId;
    }

    // 初始加载
    loadPage(1);
</script>
</body>
</html>
